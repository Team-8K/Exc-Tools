[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Supabase env vars are set in Netlify UI → Site → Environment variables:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# They are injected at build time because Vite picks up any VITE_* env var.

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
